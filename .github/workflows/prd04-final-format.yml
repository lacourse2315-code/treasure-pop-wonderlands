name: PRD-04 final formatter

on:
  push:
    paths:
      - '.github/workflows/prd04-final-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Format PRD-04 E2E with exact project Prettier
        run: |
          test "$(npx prettier --version)" = "3.9.6"
          npx prettier --write tests/e2e/prd04.spec.ts
          git diff --check
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'lacourse2315-code'
          git config user.email 'lacourse2315@gmail.com'
          git add tests/e2e/prd04.spec.ts
          git commit -m 'style: apply exact Prettier to PRD-04 collision E2E'
          git push origin HEAD:main
