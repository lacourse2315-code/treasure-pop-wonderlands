name: PRD-05 exact formatter

on:
  push:
    paths:
      - '.github/workflows/prd05-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: test "$(./node_modules/.bin/prettier --version)" = "3.9.6"
      - run: ./node_modules/.bin/prettier --write src/domain/gameplay/worldDepth.ts src/presentation/phaser/scenes/PlayShellScene.ts src/styles/global.css tests/unit/worldDepth.test.ts tests/e2e/prd05.spec.ts
      - run: git diff --check
      - run: |
          if ! git diff --quiet; then
            git config user.name 'lacourse2315-code'
            git config user.email 'lacourse2315@gmail.com'
            git add src/domain/gameplay/worldDepth.ts src/presentation/phaser/scenes/PlayShellScene.ts src/styles/global.css tests/unit/worldDepth.test.ts tests/e2e/prd05.spec.ts
            git commit -m 'style: format PRD-05 visual prototype'
            git push origin HEAD:main
          fi
