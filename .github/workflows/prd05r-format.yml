name: PRD-05R temporary formatter
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip-format]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run format
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "wonderlands-qa"
            git config user.email "actions@users.noreply.github.com"
            git add .
            git commit -m "style: format PRD-05R candidate [skip-format]"
            git push
          fi
