name: PRD-04 temporary diagnostics
on:
  push:
    paths:
      - '.github/workflows/prd04-diagnose.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run lint > PRD04_LINT_DIAGNOSTIC.txt 2>&1 || true
      - run: |
          git config user.name 'lacourse2315-code'
          git config user.email 'lacourse2315@gmail.com'
          git add PRD04_LINT_DIAGNOSTIC.txt
          git commit -m 'chore: capture PRD-04 lint diagnostics'
          git push origin HEAD:main
